<!DOCTYPE html>
<html>
<head>
    <title>Monitoring Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script>
    let start = Date.now();
    function updateTimer() {
        let now = Date.now();
        let elapsed = Math.floor((now - start) / 1000);
        document.getElementById('timer').innerText = "Timer: " + elapsed + "s";
    }
    setInterval(updateTimer, 1000);

    function fetchAlerts() {
        fetch("/alerts")
            .then(response => response.json())
            .then(alerts => {
                let alertDiv = document.getElementById('alerts');
                if (alerts.length > 0) {
                    let html = '<ul class="list-group">';
                    alerts.forEach(alert => {
                        html += `<li class="list-group-item list-group-item-danger">${alert}</li>`;
                    });
                    html += '</ul>';
                    alertDiv.innerHTML = html;
                } else {
                    alertDiv.innerHTML = '<div class="alert alert-success">No anomalies detected.</div>';
                }
            });
    }
    setInterval(fetchAlerts, 2000);
    window.onload = fetchAlerts;
    </script>
</head>
<body class="container mt-4">
    <div id="timer" class="mb-3"></div>
    <h2>Anomaly Alerts</h2>
    <div id="alerts"></div>
</body>
</html>
