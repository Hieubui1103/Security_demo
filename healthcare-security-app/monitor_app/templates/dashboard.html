<!DOCTYPE html>
<html>
<head>
    <title>Monitoring Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent outer scrollbars */
        }
        body.container {
            width: 90vw;
            max-width: 100vw;
            height: 100vh;
            overflow: hidden; /* Prevent outer scrollbars */
        }
        .scroll-table-container {
            margin: 30px auto 50px auto;
            max-width: 900px;
            height: 600px; /* 7 rows x ~56px + header */
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
            background: #fff;
        }
        .scroll-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
        }
        .scroll-table thead th {
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 2;
            border-bottom: 2px solid #000 !important;
        }
        .scroll-table th, .scroll-table td {
            border: 1px solid #000 !important;
            vertical-align: top;
            word-break: break-word;
        }
        .scroll-table tbody tr {
            height: 56px;
        }
    </style>
    <script>
    function fetchAlerts() {
        fetch("/alerts")
            .then(response => response.json())
            .then(alerts => {
                let tbody = "";
                if (alerts.length > 0) {
                    alerts.forEach(alert => {
                        tbody += `<tr>
                            <td>${alert.timestamp}</td>
                            <td>${alert.high_access}</td>
                            <td>${alert.off_hour}</td>
                        </tr>`;
                    });
                } else {
                    tbody = `<tr><td colspan="3" class="text-center text-success">No anomalies detected.</td></tr>`;
                }
                document.getElementById('alerts-body').innerHTML = tbody;
            });
    }
    setInterval(fetchAlerts, 2000);
    window.onload = fetchAlerts;
    </script>
</head>
<body class="container mt-4">
    <h2>Anomaly Alerts</h2>
    <div class="scroll-table-container">
        <table class="table scroll-table">
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>High Anomaly Detection</th>
                    <th>Off-hour Detection</th>
                </tr>
            </thead>
            <tbody id="alerts-body">
                <tr><td colspan="3" class="text-center">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</body>
</html>
